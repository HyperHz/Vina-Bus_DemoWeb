<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ban do</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; }
    #info { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white;
            padding: 8px 12px; border-radius: 6px; font: 14px sans-serif; max-width: 280px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="info">Bấm lên bản đồ để chọn điểm đầu</div>

  <script>
    const map = L.map("map").setView([10.7769, 106.7009], 15);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap contributors"
    }).addTo(map);

    const dongs = t => t.split(/\r?\n/).filter(l => l.trim() !== "");

    // A..MapNode.txt -> pts[id] = [lat, lon] 
    function docGraph(text) {                       //function đọc map
      const L_ = dongs(text);                       //tạo gọi L là mảng các dòng của file 
      const n = Number(L_[0].split(" ")[0]);        // lấy số node cần nhập (dòng đầu của file chứa số node  và cạnh)
      const pts = new Array(n);                     // tạo mảng mới chứa dữ liệu.
      for (let i = 1; i <= n; i++) {                //vòng lặp của python chạy n lần để đọc dữ liệu đỉnh
        const [id, lat, lon] = L_[i].split(" ").map(Number);    // đưa từng dữ liệu vào id/ kinh độ / vĩ độ   --- split chỉ tách thành các string  --- map(number) biến nó thành số
        pts[id] = [lat, lon];                       // lưu tọa độ node vào pts để hiển thị bằng leaflet sau đó
      }
      return pts;
    }

    // A..DườngĐiXeBus.txt ->  blocks["tuyến_trạmđầu_trạmcuối"]  = [[lat, lon], ...]
    function docBusRoute(text) {                                        //đọc A..DườngĐiXeBus
      const L_ = dongs(text), blocks = {};          
      let i = 0;
      while (i < L_.length) {                                           // đọc dữ liệu gồm (1 dòng chứa tuyến -- id trạm bắt đầu -- id trạm kết thúc - K node đi qua) rồi lặp lại
        const [r, StartId, EndId, k] = L_[i++].split(" ").map(Number); // đưa từng dữ liệu vào r=tuyến xe bus/ trạm bắt đầu / trạm tiếp theo liền kề/ node đường đi qua    --- split chỉ tách thành các string  --- map(number) biến nó thành số
        const arr = [];                                                 //tạo mảng chứa dữ liệu các node đường xe bus đi qua
        for (let j = 0; j < k; j++) arr.push(L_[i++].split(" ").map(Number));   //tổng hợp các node đi qua 
        blocks[r + "_" + StartId + "_" + EndId] = arr;      //block(r_starid_endid) = các node đi qua. khi đó  ví dụ  block("0_13626_13638")
      }
      return blocks;
    }

    // routes.txt -> routes[route_id] = { ref, name }
    function docRoutes(text) {
      const routes = {};
      dongs(text).forEach(l => {
        const p = l.split("\t");
        routes[Number(p[0])] = { ref: p[1], name: p[2] };
      });
      return routes;
    }

    // ketqua.txt: mỗi dòng "route_id id id id ...", route_id = -1 là đi bộ
    // -> [{ route, ids, points }]
    function docKetQua(text, pts, blocks) {
      return dongs(text).map(l => {
        const [route, ...ids] = l.split(" ").map(Number);
        let points;
        if (route === -1) {
          points = ids.map(id => pts[id]);
        } else {
          // các id là trạm; giữa hai trạm lấy điểm trung gian từ bus_route.txt
          points = [pts[ids[0]]];
          for (let k = 0; k + 1 < ids.length; k++) {
            const mid = blocks[route + "_" + ids[k] + "_" + ids[k + 1]];
            if (mid) points.push(...mid);
            points.push(pts[ids[k + 1]]);
          }
        }
        return { route, ids, points };
      });
    }

    // ---- Chọn điểm đầu / điểm cuối bằng cách bấm lên bản đồ ----
    function timNodeGanNhat(lat, lon, pts) {
      let best = -1, bestD = Infinity;
      for (let id = 0; id < pts.length; id++) {
        const d = (pts[id][0] - lat) ** 2 + (pts[id][1] - lon) ** 2;
        if (d < bestD) { bestD = d; best = id; }
      }
      return best;
    }

    const diem = [];                              // id node đã chọn (tối đa 2)
    const danhDau = L.layerGroup().addTo(map);    // các chấm đánh dấu điểm chọn

    function chonDiem(pts) {
      map.on("click", e => {
        if (diem.length === 2) { diem.length = 0; danhDau.clearLayers(); }   // chọn lại từ đầu
        const id = timNodeGanNhat(e.latlng.lat, e.latlng.lng, pts);
        diem.push(id);
        const dau = diem.length === 1;
        L.circleMarker(pts[id], { radius: 9, color: "black", fillColor: dau ? "gold" : "orange", fillOpacity: 1 })
          .bindTooltip((dau ? "Điểm đầu" : "Điểm cuối") + " (node " + id + ")", { permanent: true, direction: "top" })
          .addTo(danhDau);
        document.getElementById("info").innerHTML = dau
          ? "Điểm đầu: node " + id + "<br>Bấm tiếp để chọn điểm cuối"
          : "Điểm đầu: node " + diem[0] + "<br>Điểm cuối: node " + id;
        if (!dau) console.log("Chạy C++ với:", diem[0], diem[1]);
      });
    }

    async function nap() {
      const get = async f => (await fetch(f)).text();
      const [gt, bt, rt] = await Promise.all(
        ["data/A..MapNode.txt", "data/A..DườngĐiXeBus.txt", "data/A..CácTuyếnXeBus.txt"].map(get));

      const pts = docGraph(gt);
      const blocks = docBusRoute(bt);
      const routes = docRoutes(rt);

      chonDiem(pts);

      // ketqua.txt tải riêng: chưa có thì chỉ hiện bản đồ để chọn điểm
      const kr = await fetch("data/A..ketqua.txt");
      if (!kr.ok) { map.fitBounds(L.latLngBounds(pts)); return; }
      const segs = docKetQua(await kr.text(), pts, blocks);

      const all = [], info = [];

      segs.forEach(seg => {
        all.push(...seg.points);

        if (seg.route === -1) {
          // Đi bộ: nét đỏ + các nút trên đường đi
          L.polyline(seg.points, { color: "red", weight: 4 }).addTo(map);
          seg.points.forEach(p => {
            L.circleMarker(p, { radius: 3, color: "red", fillColor: "white", fillOpacity: 1, weight: 1.5 }).addTo(map);
          });
          info.push("Đi bộ");
        } else {
          // Đi xe buýt: nét xanh từ trạm này đến trạm kia
          const r = routes[seg.route] || { ref: seg.route, name: "" };
          L.polyline(seg.points, { color: "blue", weight: 5 })
            .bindTooltip("Tuyến " + r.ref + ": " + r.name)
            .addTo(map);

          // Trạm lên xe và trạm xuống xe: xanh lá
          const lenXe = seg.ids[0], xuongXe = seg.ids[seg.ids.length - 1];
          L.circleMarker(pts[lenXe], { radius: 7, color: "green", fillColor: "green", fillOpacity: 1 })
            .bindTooltip("Lên xe tuyến " + r.ref + " (trạm " + lenXe + ")").addTo(map);
          L.circleMarker(pts[xuongXe], { radius: 7, color: "green", fillColor: "green", fillOpacity: 1 })
            .bindTooltip("Xuống xe (trạm " + xuongXe + ")").addTo(map);
          info.push("Xe buýt " + r.ref + " (" + (seg.ids.length - 1) + " chặng)");
        }
      });

      // Điểm đầu và điểm cuối của kết quả đang vẽ
      const start = segs[0].ids[0];
      const end = segs[segs.length - 1].ids[segs[segs.length - 1].ids.length - 1];
      L.circleMarker(pts[start], { radius: 9, color: "black", fillColor: "gold", fillOpacity: 1 })
        .bindTooltip("Xuất phát (node " + start + ")", { permanent: true, direction: "top" }).addTo(map);
      L.circleMarker(pts[end], { radius: 9, color: "black", fillColor: "orange", fillOpacity: 1 })
        .bindTooltip("Đích (node " + end + ")", { permanent: true, direction: "top" }).addTo(map);

      document.getElementById("info").innerHTML = info.join(" → ");
      map.fitBounds(L.latLngBounds(all));
    }

    nap();
  </script>
</body>
</html>
